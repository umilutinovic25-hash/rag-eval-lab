<!doctype html>
<html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--bg:#fff;--fg:#1c2b25;--muted:#51645b;--line:#d5e0da;--green:#123c35;--soft:#eef4f0;--bad:#8a2d1f;--ok:#1d6a4a}
@media (prefers-color-scheme:dark){:root{--bg:#10201b;--fg:#e8f0ec;--muted:#a6b9b0;--line:#2c4a40;--green:#7fd1b2;--soft:#173229;--bad:#ff9d8a;--ok:#7fd1b2}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}
h1{font-family:Georgia,serif;font-size:26px;margin:8px 0}
.bar{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,input,select{font:inherit;color:inherit;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:44px}
button.on{background:var(--green);color:var(--bg);border-color:var(--green)}
.card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}

.a{background:var(--soft);padding:10px;border-radius:8px;margin:8px 0;white-space:pre-wrap}
.p{color:var(--muted);font-size:14px;border-left:3px solid var(--line);padding-left:10px;margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.muted{color:var(--muted);font-size:14px}.tag{font-size:12px;color:var(--muted)}
textarea{width:100%;box-sizing:border-box;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:44px}

<script>
const ANSWERS=[{"id": "test3:V02", "question": "Is a second verification step needed when I log in to my email?", "answer": "Yes, a second verification step is needed when you log in to your email.[hb-05-chunk-1]", "passages": ["Multi-factor authentication (MFA) is required for email, VPN and all internal tools."], "fallback": null}, {"id": "test3:V03", "question": "Am I allowed to give my password to a coworker?", "answer": "No, you are not allowed to give your password to a coworker, including those from IT. [hb-05-chunk-2]", "passages": ["Multi-factor authentication (MFA) is required for email, VPN and all internal tools.", "Never share passwords, also not with colleagues from IT."], "fallback": null}, {"id": "test3:V05", "question": "Can I use my remaining holiday days after the year has ended?", "answer": "Grounded response based on retrieved context:\n[hb-07-chunk-0] Annual leave policy: employees get 22 days of annual leave per calendar year. Leave requests must be made two weeks in advance in HR portal.\n[hb-07-chunk-1] Under this policy, unused leave can be carried over until 31 March. Sick leave follows a separate policy.", "passages": ["Annual leave policy: employees get 22 days of annual leave per calendar year. Leave requests must be made two weeks in advance in HR portal.", "Under this policy, unused leave can be carried over until 31 March. Sick leave follows a separate policy."], "fallback": "polarity_conflict"}, {"id": "test3:V06", "question": "Does the training allowance roll over into the next year?", "answer": "No, the unused budget does not carry over to next year.[hb-08-chunk-1]", "passages": ["Agree training with your manager before booking. Unused budget does not carry over to next year."], "fallback": null}, {"id": "test3:V08", "question": "Do I have to get my manager's agreement before I register for a conference?", "answer": "Yes, you need to agree training with your manager before booking. [hb-08-chunk-1]", "passages": ["Agree training with your manager before booking. Unused budget does not carry over to next year."], "fallback": null}, {"id": "test3:V10", "question": "Do I have to hold on to the original flight receipts?", "answer": "Yes, you have to hold on to the original flight receipts. [hb-04-chunk-0] [hb-04-chunk-1]", "passages": ["Business travel must be approved before booking. Travel receipts must be submitted within 30 days of your return, through finance app.", "Keep original receipts for hotels and flights. Daily allowances follow national rules for each destination."], "fallback": null}, {"id": "test3:V21", "question": "Are parking spaces assigned to individual people permanently?", "answer": "No, parking spaces are not assigned to individual people permanently; they are shared and reserved through the facilities app on a first come, first served basis.[hb-09-chunk-1]", "passages": ["Parking is limited: spaces are shared and reserved through facilities app, first come, first served."], "fallback": null}, {"id": "test3:V25", "question": "Is the old limit of 2 remote days per week still in force?", "answer": "No, the old limit of 2 remote days per week is not in force; the new limit is up to 3 days per week. [hb-03-chunk-0]", "passages": ["Remote work: employees can work remotely up to 3 days per week."], "fallback": null}, {"id": "test4:W04", "question": "May someone from the IT department ask me for my password?", "answer": "No, according to the passage, passwords should never be shared, not even with IT colleagues. [hb-05-chunk-2]", "passages": ["Never share passwords, also not with colleagues from IT."], "fallback": null}, {"id": "test4:W06", "question": "Can I submit a leave request just one week before my holiday starts?", "answer": "No, leave requests must be made two weeks in advance in the HR portal. [hb-07-chunk-0]", "passages": ["Annual leave policy: employees get 22 days of annual leave per calendar year. Leave requests must be made two weeks in advance in HR portal."], "fallback": null}, {"id": "test4:W09", "question": "Can I pay for a certification from the training budget?", "answer": "Yes, you can pay for a certification from the training budget. [hb-08-chunk-0]", "passages": ["Each employee has a training budget of 800 EUR per year for courses, conferences and certifications."], "fallback": null}, {"id": "test4:W10", "question": "Can I pay for a course first and tell my manager afterwards?", "answer": "No, based on the given passage, the budget is allocated for courses, conferences, and certifications, implying prior approval or planning might be necessary. [hb-08-chunk-0]", "passages": ["Each employee has a training budget of 800 EUR per year for courses, conferences and certifications."], "fallback": null}, {"id": "test4:W11", "question": "Will leftover training money be added to next year's budget?", "answer": "No, unused budget does not carry over to next year. [hb-08-chunk-1]", "passages": ["Agree training with your manager before booking. Unused budget does not carry over to next year."], "fallback": null}, {"id": "test4:W12", "question": "Do I need sign-off before booking a flight for work?", "answer": "Yes, business travel must be approved before booking. [hb-04-chunk-0]", "passages": ["Business travel must be approved before booking. Travel receipts must be submitted within 30 days of your return, through finance app.", "Agree training with your manager before booking. Unused budget does not carry over to next year."], "fallback": null}, {"id": "test4:W18", "question": "Can I swap a remote day for another day in the same week?", "answer": "Yes. [hb-03-chunk-2]", "passages": ["Remote work days can be moved within same week."], "fallback": null}, {"id": "test4:W19", "question": "Am I allowed more than three remote days in a single week?", "answer": "No, you are not allowed more than three remote days in a single week. [hb-03-chunk-0]", "passages": ["Remote work: employees can work remotely up to 3 days per week.", "Remote work days can be moved within same week."], "fallback": null}, {"id": "test4:W20", "question": "Do I need to be reachable by phone on my home-office days?", "answer": "Grounded response based on retrieved context:\n[hb-03-chunk-3] Core hours from 10:00 to 15:00 apply on remote days, and you must be reachable by chat and phone during core hours.\n[hb-10-chunk-0] IT support hours are 08:00 to 18:00, Monday to Friday. Contact support through IT portal or by phone.", "passages": ["Core hours from 10:00 to 15:00 apply on remote days, and you must be reachable by chat and phone during core hours.", "IT support hours are 08:00 to 18:00, Monday to Friday. Contact support through IT portal or by phone."], "fallback": "polarity_conflict"}, {"id": "test4:W22", "question": "Can I order a headset together with my laptop replacement?", "answer": "Yes, you can order a headset together with your laptop replacement. [hb-01-chunk-2][hb-01-chunk-3]", "passages": ["Report lost or stolen devices to security first. Request a replacement laptop in IT portal under Hardware.", "Accessories such as mouse or headset are ordered through that same form."], "fallback": null}, {"id": "test4:W23", "question": "Does a broken laptop get replaced?", "answer": "Yes. [hb-01-chunk-0]", "passages": ["Laptop replacement: broken, lost or stolen laptops can be replaced."], "fallback": null}, {"id": "test4:W25", "question": "Do I need my badge at every door I enter?", "answer": "Yes, you need your badge at every door you enter. [hb-09-chunk-0]", "passages": ["Office access requires your personal badge at every entrance. Lost badges must be reported to reception on same day.", "Multi-factor authentication (MFA) is required for email, VPN and all internal tools."], "fallback": null}, {"id": "test4:W28", "question": "Can I call IT support on a Saturday morning?", "answer": "No, you cannot call IT support on a Saturday morning as their hours are from 08:00 to 18:00, Monday to Friday. [hb-10-chunk-0]", "passages": ["IT support hours are 08:00 to 18:00, Monday to Friday. Contact support through IT portal or by phone."], "fallback": null}, {"id": "test5:X03", "question": "Do I need multi-factor login for the VPN?", "answer": "Yes, you need multi-factor authentication for the VPN.[hb-05-chunk-1]", "passages": ["Multi-factor authentication (MFA) is required for email, VPN and all internal tools."], "fallback": null}, {"id": "test5:X04", "question": "Can I tell my password to a helpdesk colleague who is helping me?", "answer": "No. [hb-05-chunk-2]", "passages": ["Never share passwords, also not with colleagues from IT."], "fallback": null}, {"id": "test5:X06", "question": "Can I ask for time off with only three days notice?", "answer": "No, you cannot ask for time off with only three days notice. Leave requests must be made two weeks in advance. [hb-07-chunk-0]", "passages": ["Annual leave policy: employees get 22 days of annual leave per calendar year. Leave requests must be made two weeks in advance in HR portal.", "Remote work: employees can work remotely up to 3 days per week."], "fallback": null}, {"id": "test5:X08", "question": "Is training budget I did not use kept for the following year?", "answer": "No, unused budget does not carry over to the next year. [hb-08-chunk-1]", "passages": ["Agree training with your manager before booking. Unused budget does not carry over to next year."], "fallback": null}, {"id": "test5:X10", "question": "Can the training budget pay for a certification exam?", "answer": "Yes, the training budget of 800 EUR per year can pay for a certification exam. [hb-08-chunk-0]", "passages": ["Each employee has a training budget of 800 EUR per year for courses, conferences and certifications."], "fallback": null}, {"id": "test5:X12", "question": "Does a business trip need approval before I book it?", "answer": "Yes, business travel must be approved before booking. [hb-04-chunk-0]", "passages": ["Business travel must be approved before booking. Travel receipts must be submitted within 30 days of your return, through finance app."], "fallback": null}, {"id": "test5:X13", "question": "Is a photo of the hotel invoice enough, or do I keep the paper one?", "answer": "You should keep the original receipts for hotels and flights. [hb-04-chunk-1]", "passages": ["Keep original receipts for hotels and flights. Daily allowances follow national rules for each destination."], "fallback": null}, {"id": "test5:X15", "question": "Can I work from home four days a week?", "answer": "[hb-03-chunk-0] Remote work: employees can work remotely up to 3 days per week.", "passages": ["Remote work: employees can work remotely up to 3 days per week."], "fallback": null}, {"id": "test5:X16", "question": "Can I swap a remote day for another day in the same week?", "answer": "Yes. [hb-03-chunk-2]", "passages": ["Remote work days can be moved within same week."], "fallback": null}, {"id": "test5:X19", "question": "Does IT copy my accounts and files onto the new laptop?", "answer": "Yes, IT copies your accounts and files onto the new laptop. [hb-01-chunk-1]", "passages": ["After manager approval, a replacement laptop is set up by IT staff with your files, accounts, email and access rights, and handover can take up to 5 business days."], "fallback": null}, {"id": "test5:X21", "question": "Does a new hire get a buddy?", "answer": "Yes, a new hire gets a buddy. [hb-06-chunk-1]", "passages": ["A buddy is assigned in your first week and helps you get started with tools, people and team habits."], "fallback": null}, {"id": "test5:X23", "question": "Will my manager talk to me about onboarding again after the first month?", "answer": "Yes, your manager will schedule a check-in after the first month. [hb-06-chunk-2]", "passages": ["Your manager schedules a check-in at end of month one and again after three months."], "fallback": null}, {"id": "test5:X25", "question": "Do I book parking through an app?", "answer": "Yes, parking spaces are shared and reserved through the facilities app. [hb-09-chunk-1]", "passages": ["Parking is limited: spaces are shared and reserved through facilities app, first come, first served."], "fallback": null}, {"id": "test5:X26", "question": "Is there enough parking for everyone who drives?", "answer": "[hb-09-chunk-1] Parking is limited: spaces are shared and reserved through facilities app, first come, first served.", "passages": ["Parking is limited: spaces are shared and reserved through facilities app, first come, first served."], "fallback": null}, {"id": "test5:X28", "question": "Is the helpdesk available on Sunday afternoon?", "answer": "No, the helpdesk is not available on Sunday afternoon. [hb-10-chunk-0]", "passages": ["IT support hours are 08:00 to 18:00, Monday to Friday. Contact support through IT portal or by phone."], "fallback": null}, {"id": "test5:X30", "question": "Can I reach IT support by phone?", "answer": "Yes, you can reach IT support by phone. [hb-10-chunk-0]", "passages": ["IT support hours are 08:00 to 18:00, Monday to Friday. Contact support through IT portal or by phone.", "For a laptop that does not start, bring it to IT desk on floor two. Outside support hours, urgent security incidents go to on-call line."], "fallback": null}, {"id": "test6:Y03", "question": "Is return shipping free if the item arrived broken?", "answer": "Yes. [sh-01-chunk-2]", "passages": ["Return shipping is free for defective items; otherwise the customer pays return shipping."], "fallback": null}, {"id": "test6:Y04", "question": "Must I keep the original box if I want to return something?", "answer": "Grounded response based on retrieved context:\n[sh-01-chunk-0] Items can be returned within 30 days of delivery in their original packaging.", "passages": ["Items can be returned within 30 days of delivery in their original packaging."], "fallback": "modality_conflict"}, {"id": "test6:Y08", "question": "Is shipping free on an order of 60 EUR?", "answer": "Yes, shipping is free on an order of 60 EUR. [sh-03-chunk-1]", "passages": ["Orders above 50 EUR ship free with standard delivery. We do not ship to post office boxes."], "fallback": null}, {"id": "test6:Y09", "question": "Can you deliver to a post office box?", "answer": "No, we do not ship to post office boxes. [sh-03-chunk-1]", "passages": ["Orders above 50 EUR ship free with standard delivery. We do not ship to post office boxes."], "fallback": null}, {"id": "test6:Y11", "question": "Does the warranty cover a phone I dropped?", "answer": "No, the warranty does not cover damage caused by dropping the device.[sh-04-chunk-0]", "passages": ["All electronics have a 24 month warranty. The warranty does not cover water damage or damage caused by dropping the device."], "fallback": null}, {"id": "test6:Y15", "question": "Can I swap a gift card for cash?", "answer": "No, gift cards cannot be exchanged for cash. [sh-05-chunk-0]", "passages": ["Gift cards are valid for 12 months from the purchase date. Gift cards cannot be exchanged for cash.", "Support can block a lost gift card, but a gift card cannot be replaced after redemption."], "fallback": null}, {"id": "test6:Y18", "question": "Can I phone support on a Sunday?", "answer": "No, you cannot phone support on a Sunday as support by phone is only available from 10:00 to 16:00 on weekdays. [sh-06-chunk-0]", "passages": ["Support is available by chat from 09:00 to 20:00 every day and by phone from 10:00 to 16:00 on weekdays."], "fallback": null}, {"id": "test6:Y22", "question": "Is a 17-year-old allowed to open an account?", "answer": "No. [sh-07-chunk-1]", "passages": ["Customers must be at least 18 years old to create an account."], "fallback": null}, {"id": "test6:Y23", "question": "Do you save my whole card number?", "answer": "No, we never store full card numbers. [sh-07-chunk-0]", "passages": ["An account can be deleted at any time on the settings page, and the deletion becomes final after 30 days. We never store full card numbers."], "fallback": null}, {"id": "test6:Y27", "question": "Do I get points when I buy a gift card?", "answer": "No, points are not earned on gift card purchases.[sh-08-chunk-1]", "passages": ["Points are not earned on gift card purchases."], "fallback": null}, {"id": "test6:Y31", "question": "Do I need a photo of the defect for a claim?", "answer": "Yes, you need a photo of the defect for a claim.[sh-04-chunk-1]", "passages": ["A claim needs the order number and a photo of the defect. Send claims through form W-7."], "fallback": null}, {"id": "test3:V17", "question": "Who must I tell first when a work device goes missing?", "answer": "Report lost or stolen devices to security first. [hb-01-chunk-2]", "passages": ["Report lost or stolen devices to security first. Request a replacement laptop in IT portal under Hardware."], "fallback": null}, {"id": "test4:W07", "question": "Where do I send my vacation request?", "answer": "You must make leave requests in the HR portal. [hb-07-chunk-0]", "passages": ["Annual leave policy: employees get 22 days of annual leave per calendar year. Leave requests must be made two weeks in advance in HR portal."], "fallback": null}, {"id": "test3:V19", "question": "How often does my manager check in with me during onboarding?", "answer": "Your manager schedules check-ins at the end of month one and after three months. [hb-06-chunk-2]", "passages": ["Your manager schedules a check-in at end of month one and again after three months."], "fallback": null}, {"id": "test5:X01", "question": "What is the shortest password the company accepts?", "answer": "The company accepts passwords that must contain at least 12 characters. [hb-05-chunk-0]", "passages": ["Passwords must be changed every 90 days and must contain at least 12 characters."], "fallback": null}, {"id": "test6:Y12", "question": "Which form do I use to make a warranty claim?", "answer": "You use form W-7 to make a warranty claim. [sh-04-chunk-1]", "passages": ["A claim needs the order number and a photo of the defect. Send claims through form W-7."], "fallback": null}, {"id": "test6:Y19", "question": "How fast do you answer emails?", "answer": "Replies to email arrive within 2 working days. [sh-06-chunk-1]", "passages": ["Replies to email arrive within 2 working days. Complaints are handled by the quality team."], "fallback": null}, {"id": "test4:W03", "question": "Which systems demand multi-factor authentication?", "answer": "Multi-factor authentication is required for email, VPN, and all internal tools. [hb-05-chunk-1]", "passages": ["Multi-factor authentication (MFA) is required for email, VPN and all internal tools."], "fallback": null}, {"id": "test6:Y20", "question": "Who deals with complaints?", "answer": "Complaints are handled by the quality team. [sh-06-chunk-1]", "passages": ["Replies to email arrive within 2 working days. Complaints are handled by the quality team."], "fallback": null}, {"id": "test5:X27", "question": "Where should I take a laptop that will not boot?", "answer": "Bring it to the IT desk on floor two. [hb-10-chunk-1]", "passages": ["For a laptop that does not start, bring it to IT desk on floor two. Outside support hours, urgent security incidents go to on-call line.", "Laptop replacement: broken, lost or stolen laptops can be replaced."], "fallback": null}, {"id": "test6:Y01", "question": "How long after delivery can I send an item back?", "answer": "Items can be returned within 30 days of delivery in their original packaging. [sh-01-chunk-0]", "passages": ["Items can be returned within 30 days of delivery in their original packaging.", "Refunds are paid to the original payment method within 7 business days after the parcel reaches our warehouse."], "fallback": null}, {"id": "test3:V01", "question": "How many characters long does a password need to be at minimum?", "answer": "A password needs to be at least 12 characters long. [hb-05-chunk-0]", "passages": ["Passwords must be changed every 90 days and must contain at least 12 characters."], "fallback": null}, {"id": "test4:W08", "question": "How much does each person get for professional development per year?", "answer": "Each person gets 800 EUR for professional development per year. [hb-08-chunk-0]", "passages": ["Each employee has a training budget of 800 EUR per year for courses, conferences and certifications."], "fallback": null}, {"id": "test3:V04", "question": "How many days of annual leave do staff receive each year?", "answer": "Employees get 22 days of annual leave per calendar year.[hb-07-chunk-0]", "passages": ["Annual leave policy: employees get 22 days of annual leave per calendar year. Leave requests must be made two weeks in advance in HR portal."], "fallback": null}, {"id": "test3:V24", "question": "My laptop will not turn on. Where should I take it?", "answer": "Bring it to the IT desk on floor two. [hb-10-chunk-1]", "passages": ["For a laptop that does not start, bring it to IT desk on floor two. Outside support hours, urgent security incidents go to on-call line."], "fallback": null}, {"id": "test3:V15", "question": "How long does it take to get a replacement laptop once it is approved?", "answer": "Up to 5 business days. [hb-01-chunk-1]", "passages": ["After manager approval, a replacement laptop is set up by IT staff with your files, accounts, email and access rights, and handover can take up to 5 business days."], "fallback": null}, {"id": "test4:W13", "question": "How long after returning from a trip can I still hand in my receipts?", "answer": "Within 30 days of your return. [hb-04-chunk-0]", "passages": ["Business travel must be approved before booking. Travel receipts must be submitted within 30 days of your return, through finance app.", "Keep original receipts for hotels and flights. Daily allowances follow national rules for each destination."], "fallback": null}, {"id": "test3:V18", "question": "What does the buddy help with during the first week?", "answer": "A buddy helps with tools, people, and team habits during the first week. [hb-06-chunk-1]", "passages": ["A buddy is assigned in your first week and helps you get started with tools, people and team habits."], "fallback": null}, {"id": "test6:Y17", "question": "When can I chat with support?", "answer": "You can chat with support from 09:00 to 20:00 every day.[sh-06-chunk-0]", "passages": ["Support is available by chat from 09:00 to 20:00 every day and by phone from 10:00 to 16:00 on weekdays."], "fallback": null}, {"id": "test6:Y16", "question": "If I redeem my gift card and then lose it, can support issue a new one?", "answer": "No, support cannot issue a new gift card after redemption. [sh-05-chunk-1]", "passages": ["Support can block a lost gift card, but a gift card cannot be replaced after redemption."], "fallback": null}, {"id": "test5:X24", "question": "What do I do if I lose my entry card?", "answer": "You must report the lost badge to reception on the same day. [hb-09-chunk-0]", "passages": ["Office access requires your personal badge at every entrance. Lost badges must be reported to reception on same day."], "fallback": null}], TRANS=[{"id": "hb-01-chunk-0", "en": "Laptop replacement: broken, lost or stolen laptops can be replaced.", "sr": "Zamena laptopa: pokvareni, izgubljeni ili ukradeni laptopi mogu se zameniti."}, {"id": "hb-01-chunk-1", "en": "After manager approval, a replacement laptop is set up by IT staff with your files, accounts, email and access rights, and handover can take up to 5 business days.", "sr": "Posle odobrenja rukovodioca, IT služba priprema zamenski laptop sa vašim datotekama, nalozima, imejlom i pravima pristupa; primopredaja može trajati do 5 radnih dana."}, {"id": "hb-01-chunk-2", "en": "Report lost or stolen devices to security first. Request a replacement laptop in IT portal under Hardware.", "sr": "Izgubljene ili ukradene uređaje prijavite prvo službi bezbednosti. Zamenski laptop traži se u IT portalu, u odeljku Hardware."}, {"id": "hb-01-chunk-3", "en": "Accessories such as mouse or headset are ordered through that same form.", "sr": "Dodatna oprema, poput miša ili slušalica, naručuje se kroz isti taj formular."}, {"id": "hb-02-chunk-0", "en": "Remote work: employees can work remotely up to 2 days per week. Remote days per week are agreed with your team lead.", "sr": "Rad na daljinu: zaposleni mogu da rade od kuće do 2 dana nedeljno. Dani rada na daljinu dogovaraju se sa vođom tima."}, {"id": "hb-02-chunk-1", "en": "Remote work days can be moved within same week.", "sr": "Dani rada na daljinu mogu se pomerati unutar iste nedelje."}, {"id": "hb-03-chunk-0", "en": "Remote work: employees can work remotely up to 3 days per week.", "sr": "Rad na daljinu: zaposleni mogu da rade od kuće do 3 dana nedeljno."}, {"id": "hb-03-chunk-1", "en": "Remote days per week are agreed with your team lead and recorded in your shared team calendar.", "sr": "Dani rada na daljinu dogovaraju se sa vođom tima i beleže u zajedničkom timskom kalendaru."}, {"id": "hb-03-chunk-2", "en": "Remote work days can be moved within same week.", "sr": "Dani rada na daljinu mogu se pomerati unutar iste nedelje."}, {"id": "hb-03-chunk-3", "en": "Core hours from 10:00 to 15:00 apply on remote days, and you must be reachable by chat and phone during core hours.", "sr": "Obavezno zajedničko radno vreme od 10:00 do 15:00 važi i za rad na daljinu; tada morate biti dostupni preko četa i telefona."}, {"id": "hb-04-chunk-0", "en": "Business travel must be approved before booking. Travel receipts must be submitted within 30 days of your return, through finance app.", "sr": "Službeni put mora biti odobren pre rezervacije. Računi sa puta dostavljaju se u roku od 30 dana od povratka, preko finansijske aplikacije."}, {"id": "hb-04-chunk-1", "en": "Keep original receipts for hotels and flights. Daily allowances follow national rules for each destination.", "sr": "Sačuvajte originalne račune za hotele i letove. Dnevnice prate nacionalna pravila za svako odredište."}, {"id": "hb-05-chunk-0", "en": "Passwords must be changed every 90 days and must contain at least 12 characters.", "sr": "Lozinke se moraju menjati svakih 90 dana i moraju sadržati najmanje 12 znakova."}, {"id": "hb-05-chunk-1", "en": "Multi-factor authentication (MFA) is required for email, VPN and all internal tools.", "sr": "Višefaktorska autentifikacija (MFA) obavezna je za imejl, VPN i sve interne alate."}, {"id": "hb-05-chunk-2", "en": "Never share passwords, also not with colleagues from IT.", "sr": "Nikada ne delite lozinke, čak ni sa kolegama iz IT službe."}, {"id": "hb-06-chunk-0", "en": "New colleagues follow a two-week onboarding plan.", "sr": "Nove kolege prate dvonedeljni plan uvođenja u posao."}, {"id": "hb-06-chunk-1", "en": "A buddy is assigned in your first week and helps you get started with tools, people and team habits.", "sr": "U prvoj nedelji dodeljuje vam se kolega za podršku koji pomaže oko alata, ljudi i timskih navika."}, {"id": "hb-06-chunk-2", "en": "Your manager schedules a check-in at end of month one and again after three months.", "sr": "Vaš rukovodilac zakazuje razgovor na kraju prvog meseca i ponovo posle tri meseca."}, {"id": "hb-07-chunk-0", "en": "Annual leave policy: employees get 22 days of annual leave per calendar year. Leave requests must be made two weeks in advance in HR portal.", "sr": "Godišnji odmor: zaposleni imaju 22 dana godišnjeg odmora po kalendarskoj godini. Zahtevi za odmor podnose se dve nedelje unapred u HR portalu."}, {"id": "hb-07-chunk-1", "en": "Under this policy, unused leave can be carried over until 31 March. Sick leave follows a separate policy.", "sr": "Prema ovoj politici, neiskorišćeni odmor može se preneti do 31. marta. Bolovanje je uređeno posebnom politikom."}, {"id": "hb-08-chunk-0", "en": "Each employee has a training budget of 800 EUR per year for courses, conferences and certifications.", "sr": "Svaki zaposleni ima budžet za obuke od 800 EUR godišnje za kurseve, konferencije i sertifikacije."}, {"id": "hb-08-chunk-1", "en": "Agree training with your manager before booking. Unused budget does not carry over to next year.", "sr": "Obuku dogovorite sa rukovodiocem pre rezervacije. Neiskorišćeni budžet se ne prenosi u sledeću godinu."}, {"id": "hb-09-chunk-0", "en": "Office access requires your personal badge at every entrance. Lost badges must be reported to reception on same day.", "sr": "Za ulazak u kancelariju potrebna je lična kartica na svakom ulazu. Gubitak kartice mora se prijaviti recepciji istog dana."}, {"id": "hb-09-chunk-1", "en": "Parking is limited: spaces are shared and reserved through facilities app, first come, first served.", "sr": "Parking je ograničen: mesta se dele i rezervišu preko aplikacije za prostor, po redosledu prijave."}, {"id": "hb-10-chunk-0", "en": "IT support hours are 08:00 to 18:00, Monday to Friday. Contact support through IT portal or by phone.", "sr": "IT podrška radi od 08:00 do 18:00, od ponedeljka do petka. Podršku kontaktirajte kroz IT portal ili telefonom."}, {"id": "hb-10-chunk-1", "en": "For a laptop that does not start, bring it to IT desk on floor two. Outside support hours, urgent security incidents go to on-call line.", "sr": "Ako laptop ne može da se uključi, donesite ga na IT pult na drugom spratu. Van radnog vremena podrške, hitni bezbednosni incidenti prijavljuju se dežurnoj liniji."}];
const KEY="izvor.human-review.v1"; let state={who:"",answers:{},trans:{}};
try{state=Object.assign(state,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}; prog()};
const $=s=>document.querySelector(s);
const esc=t=>t.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function btn(group,id,val,label,store){const on=(store[id]||{}).v===val;return `<button data-g="${group}" data-id="${id}" data-v="${val}" class="${on?'on':''}" aria-pressed="${on}">${label}</button>`}
function render(){
 $("#n1").textContent=ANSWERS.length;$("#n2").textContent=TRANS.length;
 $("#s1").innerHTML=ANSWERS.map((a,i)=>`<div class="card"><div class="tag">${i+1}/${ANSWERS.length} · ${a.id}${a.fallback?' · prikazani originalni odlomci':''}</div>
 <p class="q">${esc(a.question)}</p><div class="a">${esc(a.answer)}</div>
 ${a.passages.map(p=>`<div class="p">${esc(p)}</div>`).join("")}
 <div class="row">${btn("a",a.id,"ok","Tačno",state.answers)}${btn("a",a.id,"wrong","Netačno",state.answers)}${btn("a",a.id,"partial","Delimično / nejasno",state.answers)}</div>
 <textarea data-c="a" data-id="${a.id}" placeholder="Komentar (nije obavezno)" aria-label="Komentar uz ${a.id}">${esc((state.answers[a.id]||{}).c||"")}</textarea></div>`).join("");
 $("#s2").innerHTML=TRANS.map((t,i)=>`<div class="card"><div class="tag">${i+1}/${TRANS.length} · ${t.id}</div>
 <div class="p" lang="en">${esc(t.en)}</div><div class="a" lang="sr">${esc(t.sr)}</div>
 <div class="row">${btn("t",t.id,"ok","Prevod je dobar",state.trans)}${btn("t",t.id,"fix","Treba ispraviti",state.trans)}</div>
 <textarea data-c="t" data-id="${t.id}" placeholder="Predlog ispravke" aria-label="Predlog ispravke za ${t.id}">${esc((state.trans[t.id]||{}).c||"")}</textarea></div>`).join("");
 $("#who").value=state.who||""; prog();
}
function prog(){const a=Object.keys(state.answers).filter(k=>state.answers[k].v).length,t=Object.keys(state.trans).filter(k=>state.trans[k].v).length;$("#prog").textContent=`Urađeno: odgovori ${a}/${ANSWERS.length}, prevod ${t}/${TRANS.length}`}
document.addEventListener("click",e=>{const b=e.target.closest("button[data-g]");if(!b)return;const s=b.dataset.g==="a"?state.answers:state.trans;s[b.dataset.id]=Object.assign(s[b.dataset.id]||{},{v:b.dataset.v});save();const y=window.scrollY;render();window.scrollTo(0,y)});
document.addEventListener("input",e=>{if(e.target.id==="who"){state.who=e.target.value;save();return}const c=e.target.dataset.c;if(!c)return;const s=c==="a"?state.answers:state.trans;s[e.target.dataset.id]=Object.assign(s[e.target.dataset.id]||{},{c:e.target.value});save()});
$("#t1").onclick=()=>{$("#s1").hidden=false;$("#s2").hidden=true;$("#t1").classList.add("on");$("#t2").classList.remove("on")};
$("#t2").onclick=()=>{$("#s2").hidden=false;$("#s1").hidden=true;$("#t2").classList.add("on");$("#t1").classList.remove("on")};
$("#dl").onclick=()=>{const blob=new Blob([JSON.stringify({reviewer:state.who,created_at:new Date().toISOString(),answers:state.answers,translation:state.trans},null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="human-review.json";a.click()};
render();
</script></body></html>
